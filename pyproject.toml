[build-system]
requires = ["hatchling>=1.18,<2"]
build-backend = "hatchling.build"

[project]
name = "ember-agent"
version = "0.2.0"
description = "Ember — a small, tethered, runs-anywhere AI companion. See docs/SYSTEM_VISION.md."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Volmarr Wyrd" },
]
keywords = [
    "ai-agent",
    "ai-companion",
    "edge-ai",
    "local-llm",
    "sovereign-ai",
    "mythic-engineering",
    "norse",
    "ember",
    "raspberry-pi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependencies will be declared as each first-slice phase lands.
# See docs/architecture/EMBER_FIRST_SLICE_PLAN.md §1 for the planned pins.
# Until then, only the standard library is assumed.
dependencies = []

[project.optional-dependencies]
# Per-adapter dependencies, shipped as each phase lands. Operators
# install only the extras they need.
sqlite_vec = ["sqlite-vec>=0.1.6,<0.2"]
config = ["pyyaml>=6.0,<7"]   # Enables YAML config files. TOML config works without this.
pgvector = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<0.6"]   # ADR 0010 — Postgres + pgvector Brunnr.
mcp = ["mcp>=1.27,<2"]   # ADR 0014 — bidirectional MCP integration (client + server).
# E-044 (dependency diet, docket 20 + 23): every requirement above
# and below now carries an upper bound at the next major of the
# line the code was written and tested against. The unbounded
# floors were proven harmful, not merely untidy: on 2026-10-31
# `mcp>=1.27` resolved to mcp 2.3.0, whose SDK renamed FastMCP —
# `ember mcp serve` could not have started on a fresh install.
# Bounds are reproducibility + breakage armour, claimed as such
# in docs/architecture/E-044_INSTALL_WEIGHT_CUT_II.md, not as
# byte savings. The byte cuts of this slice are the `dev` split
# below and the `secrets` shape here:
secrets = ["keyring>=24,<26"]   # ADR 0010 §2.5 — the optional keyring secret source for the pgvector Well. Its own extra, never folded into `pgvector`: keyring's Linux tree (SecretStorage + cryptography) weighs ~16.6 MB, and only operators who use the keyring source should pay it.
# Planned for later phases (filled in as they land):
#   qdrant      = ["qdrant-client>=1.9"]
#   chroma      = ["chromadb>=0.5"]
#   lancedb     = ["lancedb>=0.6"]
#   llamacpp    = ["llama-cpp-python>=0.2"]
#   validation  = ["pydantic>=2.7"]   # Richer config-error messages.
# Ollama (the first-slice Funi runtime) is reached over HTTP via the
# standard library — no client dependency required.
# E-044: `dev` is the test shape only — what the suite and the
# slice gate actually run (measured 7.6 MB installed). The lint
# tools moved to their own `lint` extra (measured 81.5 MB: mypy's
# compiled core + the ruff binary); a test-only install no longer
# pays for them. `pip install ember-agent[dev,lint]` restores the
# old combined shape.
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]
lint = [
    "ruff>=0.4,<1",
    "mypy>=1.10,<3",
]

[project.scripts]
# The single official CLI entry point — Munnr.
ember = "ember.cli.main:main"

[project.urls]
Homepage = "https://github.com/hrabanazviking/Project_Ember_Run_It_On_Your_Smart_Toaster"
Source   = "https://github.com/hrabanazviking/Project_Ember_Run_It_On_Your_Smart_Toaster"
Issues   = "https://github.com/hrabanazviking/Project_Ember_Run_It_On_Your_Smart_Toaster/issues"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/ember"]

# Keep the sdist focused on what actually constitutes Ember-the-package:
# source, tests, architecture + adapter docs, and the operator-facing
# top-level files. The inherited corpora (RunaUniversity2040, phd-2040,
# research, python, philosophy, methodology, AI_OS_Research, archive)
# are intellectual heritage preserved in the repo, but they would
# bloat the PyPI sdist from ~200 KB to ~33 MB and add no value to
# someone running `pip install ember-agent`. Same for the repo-root
# hero images (large PNG/JPEG files used by the rendered README).
#
# E-043 (install weight cut I): the same rule now covers the optional
# members and the docs corpora. The members (Verdandi, kista,
# mempalace, mimir-well, seidr_engine, astrology-engine, bifrost,
# Hamr, Open-VTT, CloakBrowser, the Old Norse dictionary) are separate
# programs that live in this monorepo and are run from a repo
# checkout — none of them is part of the `ember-agent` package, and
# the core never imports them. Dragging them into the sdist made a
# source install download ~45 MB (127 MB unpacked, mempalace alone
# 57 MB of it) to obtain a 305 KB wheel's worth of core. Excluding
# them makes the members truly optional at install: `pip install
# ember-agent` fetches the core only; a member is "installed" by
# checking out the repo, as it always has been. The elder codex and
# Mythic Plan trees under docs/ are heritage corpora in the same
# class as the already-excluded university trees, and the design
# lawbook (PDF + Markdown) and the campaign state file are repo
# furniture, not package. Nothing here deletes anything from the
# repo — an sdist exclude is a shipping decision, not a removal.
[tool.hatch.build.targets.sdist]
exclude = [
    "docs/RunaUniversity2040",
    "docs/phd-2040",
    "docs/research",
    "docs/python",
    "docs/AI_OS_Research",
    "docs/philosophy",
    "docs/methodology",
    "docs/archive",
    "assets",
    "*.png",
    "*.jpeg",
    "*.jpg",
    "*.pdf",
    "Yggdrasil_and_Huginn_and_Muninn_Theory.md",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    # E-043: optional members — separate programs, never package.
    "Verdandi",
    "kista",
    "mempalace",
    "mimir-well",
    "seidr_engine",
    "astrology-engine",
    "bifrost",
    "Hamr",
    "Open-VTT",
    "CloakBrowser",
    "cleasby-vigfusson-old-norse-dict",
    # E-043: docs heritage corpora (codex + Mythic Plan trees).
    "docs/chatdoll_codex",
    "docs/sap_codex",
    "docs/hermes_codex",
    "docs/waifu_codex",
    "docs/peer_codex",
    "docs/ragnarok_codex",
    "docs/ClawLite_Mythic_Plan",
    "docs/Pocketpal_Mythic_Plan",
    "docs/Cortex_Mythic_Plan",
    "docs/WaifuOS_Mythic_Plan",
    "docs/Open_Viking_Mythic_Plan",
    "docs/Open_LLM_VTuber_Mythic_Plan",
    "docs/AIRI_Mythic_Plan",
    "docs/Graphite_Git_Mythic_Plan",
    "docs/SillyTavern_Mythic_Plan",
    "docs/yggdrasil",
    "docs/tui",
    "docs/kloinn",
    # E-043: repo furniture, not package.
    "Volmarr_Cyber_Viking_Master_Visual_Design_Lawbook.md",
    "CAMPAIGN_STATE.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/methodology", "docs/archive", "vendor"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes baseline
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "TID",           # tidy imports
    "PL",            # pylint subset
    "RUF",           # ruff-specific
]
ignore = [
    "PLR2004",  # magic-value-comparison — too noisy at this stage
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ember"]
exclude = ["tests/", "docs/", "scripts/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: end-to-end tests through the real CLI / well (opt-in)",
    "requires_ollama: tests that need a local Ollama instance",
    "requires_lmstudio: tests that need a local LM Studio instance",
    "requires_pi: tests that need to run on a Raspberry Pi class device",
    "requires_postgres: tests that need a Postgres + pgvector instance (ADR 0010)",
    "requires_gungnir: tests that need the live Gungnir tailnet endpoint",
    "requires_podman: tests that spin up a local container via podman",
]

[tool.coverage.run]
source = ["src/ember"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
