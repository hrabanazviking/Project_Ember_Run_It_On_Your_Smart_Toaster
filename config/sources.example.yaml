# Smiðja content sources — how material reaches the Well today.
#
# This is NOT a config file (E-033): Ember reads exactly one
# config file, `ember.yaml` (or `ember.toml`), and there is no
# source-registry file. Smiðja sources are specified at the
# command line (`ember well ingest <path>`) — the local_files
# source is the one wired through today. There is no registry
# shape to learn; if one is ever built it will live in the one
# config file, not in a new file of its own.
#
# See `config/ember.example.yaml` for the chunker / embedding
# settings under `smidja:` — those ARE config keys, in the one
# file.
